# Documented claims for Smallest TTS (Waves/Models API). Hypotheses until a live run confirms them.
vendor: smallest
base_url: https://api.smallest.ai/waves/v1
token_url: https://api.smallest.ai/console/v1/auth/token
model: lightning_v3.1_pro
auth: {header: Authorization, scheme: Bearer, env: SMALLEST_API_KEY}
request_id_fields: {headers: [x-request-id, X-External-Request-Id, X-External-Session-Id], frames: [request_id, session_id, external_request_id, external_session_id]}
claims:
  tts.concurrency.max_active: {value: 1, on_exceed: 429, source: https://docs.smallest.ai/api-reference/concurrency-and-limits}
  tts.text.max_chars:         {value: 8000, source: https://docs.smallest.ai/models/api-reference/text-to-speech/synthesize-speech-sse}
  tts.ws.idle_timeout_s:      {default: 60, param: timeout, max: 180, source: https://docs.smallest.ai/models/api-reference/text-to-speech/tts}
  tts.ws.complete_backoff_ms: {default: 4000, max: 10000, source: https://docs.smallest.ai/models/api-reference/text-to-speech/tts}
  tts.ttfa_ms:                {value: 100, note: "streaming page says ~100ms; overview says ~200ms TTFB", source: https://docs.smallest.ai/models/text-to-speech/streaming}
  tts.ttfa_ms.benchmark:      {value: 200, note: "TTFB, 40 concurrent requests, WebSocket streaming, dedicated Pro pool", source: https://docs.smallest.ai/models/text-to-speech/benchmarks/latency}
  tts.concurrency.ws:         {value: 1, on_exceed: error_frame, max_connections: 5, source: https://docs.smallest.ai/api-reference/concurrency-and-limits}
  tts.text.whitespace_only:   {value: rejected, source: https://docs.smallest.ai/models/api-reference/text-to-speech/synthesize-speech-sse}
  tts.speed.range:            {value: [0.5, 2.0], source: https://docs.smallest.ai/models/text-to-speech/sync-async}
  tts.sample_rate.allowed:    {value: [8000, 16000, 24000, 44100], source: https://docs.smallest.ai/models/api-reference/text-to-speech/synthesize-speech}
  tts.error.http:             {value: [error, message], status: 400, note: "400/401/500 bodies are {error, message}", source: https://docs.smallest.ai/models/api-reference/text-to-speech/synthesize-speech}
  tts.error.ws_frame:         {value: {status: error, keys: [message, status]}, source: https://docs.smallest.ai/models/api-reference/text-to-speech/tts}
  tts.ws.complete_terminal:   {value: server_closes, note: "complete is terminal; server closes after (except inside context_id)", source: https://docs.smallest.ai/models/api-reference/text-to-speech/tts}
  tts.ws.ping:                {value: pong, resets_timer: true, source: https://docs.smallest.ai/models/api-reference/text-to-speech/tts}
  tts.token.ttl_s:            {value: [30, 900], default: 300, source: https://docs.smallest.ai/api-reference/token-based-authentication}
  tts.token.ws_survives_expiry: {value: true, note: "token is checked when the connection is made", source: https://docs.smallest.ai/api-reference/token-based-authentication}
  tts.token.expired:          {value: 401, body: {error: "Invalid or expired access token"}, source: https://docs.smallest.ai/api-reference/token-based-authentication}
  tts.token.ws_query_param:   {value: api_key, source: https://docs.smallest.ai/api-reference/token-based-authentication}
  tts.token.ws_query_param_alt: {value: token, note: "error reference says ?token=<KEY>", source: https://docs.smallest.ai/models/troubleshooting/error-reference}
