[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-api-conformance"
version = "0.1.0"
description = "Check a voice API against its own docs and against your product's SLOs."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
vac = "vac.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["vac"]
